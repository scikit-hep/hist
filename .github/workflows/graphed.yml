name: graphed

# The graphed-mvp integration (HIST-1): runs the FULL hist test suite together with the
# hist.graphed tests, so regressions from the graphed additions are caught — not just the graphed
# tests in isolation. Runs only on the graphed-mvp branch (hist's own CI runs on main / PRs).
on:
  push:
    branches: [graphed-mvp]
  workflow_dispatch:

concurrency:
  group: graphed-${{ github.ref }}
  cancel-in-progress: true

env:
  # This integration branch tracks the graphed stack's git main, NOT PyPI: the mvp packages are
  # co-developed and the hist.graphed tests use features (m52 `graphed.vary`/`points`, the
  # `variation_axis`/`unweighted` histogram fill modes) that land on main ahead of any PyPI release.
  # Pinning PyPI here silently regresses to a pre-feature graphed. Repin to PyPI once a release ships.
  # graphed core/frontend/numpy/awkward/debug are ONE consolidated package (graphed.core, ...);
  # graphed-histogram + graphed-executors + the uproot fork stay separate packages.
  GRAPHED: "graphed[awkward,numpy] @ git+https://github.com/graphed-org/graphed@main"
  EXEC: "graphed-executors @ git+https://github.com/graphed-org/graphed-executors@main"
  HISTO: "graphed-histogram @ git+https://github.com/graphed-org/graphed-histogram@main"
  UPROOT: "uproot @ git+https://github.com/graphed-org/uproot5-graphed-mvp@graphed-mvp"

jobs:
  tests:
    name: hist + graphed tests ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install graphed (mvp) siblings + hist (test extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ env.GRAPHED }}" "${{ env.EXEC }}" "${{ env.HISTO }}" \
            "${{ env.UPROOT }}"
          # hist's test deps are a PEP 735 dependency GROUP (not an extra)
          python -m pip install -e . --group test
          python -m pip install scikit-hep-testdata
      - name: Full hist suite + the graphed integration tests
        run: python -m pytest tests -q
